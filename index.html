<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trái tim 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05010a; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
const PR = Math.min(devicePixelRatio, 2);
renderer.setPixelRatio(PR);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.4, 0.6, 0.2);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- Shader hạt: nhấp nháy theo pha riêng, tia sao 4 cánh, bay lên (SPARKS), hình trái tim nhỏ (HEARTS)
const vert = /* glsl */`
  attribute vec3 aColor;
  attribute vec3 aRand;          // x: pha, y: tốc độ, z: độ "sao"
  uniform float uTime, uScale, uSize, uRise;
  varying vec3 vColor;
  varying float vTw, vStar, vFade;
  void main() {
    vec3 p = position;
    vFade = 1.0;
    #ifdef SPARKS
      float life = fract(uTime * (0.04 + aRand.y * 0.03) + aRand.x);
      p.y += life * uRise;
      p.x += sin(life * 6.283 * 2.0 + aRand.x * 40.0) * 2.0;
      vFade = sin(life * 3.14159);
    #endif
    float s = 0.5 + 0.5 * sin(uTime * (1.5 + aRand.y * 4.0) + aRand.x * 6.283);
    vTw = s * s * s;
    vStar = step(0.85, aRand.z) * vTw;
    vColor = aColor;
    float grow = 1.0 + vTw * 1.6 + vStar * 2.0;
    #ifdef HEARTS
      grow = 1.0 + vTw * 0.25;
    #endif
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_PointSize = uSize * grow * vFade * uScale / -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;
const frag = /* glsl */`
  uniform float uBeat, uBright;
  varying vec3 vColor;
  varying float vTw, vStar, vFade;
  void main() {
    vec2 p = gl_PointCoord - 0.5;
    #ifdef HEARTS
      vec2 q = vec2(p.x, -p.y) * 2.7 + vec2(0.0, 0.15);
      float u = dot(q, q) - 1.0;
      float f = u * u * u - q.x * q.x * q.y * q.y * q.y;     // phương trình ẩn của trái tim, f<0 là bên trong
      float a = (smoothstep(0.1, -0.1, f) * (0.7 + vTw * 0.6) + exp(-dot(p, p) * 20.0) * 0.25) * vFade * uBright;
      gl_FragColor = vec4(vColor * a, 1.0);
    #else
      float r = length(p) * 2.0;
      if (r > 1.0) discard;
      float glow = exp(-r * r * 7.0);
      float star = exp(-abs(p.x) * 45.0) * exp(-abs(p.y) * 5.0) + exp(-abs(p.y) * 45.0) * exp(-abs(p.x) * 5.0);
      float a = (glow * (0.45 + vTw * 0.9 + uBeat * 0.5) + star * vStar * 2.0) * vFade * uBright;
      vec3 c = mix(vColor, vec3(1.0), vTw * 0.5 + vStar * 0.5);
      gl_FragColor = vec4(c * a, 1.0);
    #endif
  }`;

const uniforms = { uTime: { value: 0 }, uBeat: { value: 0 }, uScale: { value: 1 } };
const makePoints = (n, fill, { size, bright = 1, defs = {}, rise = 28, parent = scene }) => {
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), rnd = new Float32Array(n * 3);
  const c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    fill(i, pos, c);
    col.set([c.r, c.g, c.b], i * 3);
    rnd.set([Math.random(), Math.random(), Math.random()], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aRand', new THREE.BufferAttribute(rnd, 3));
  const pts = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { ...uniforms, uSize: { value: size }, uBright: { value: bright }, uRise: { value: rise } },
    vertexShader: vert, fragmentShader: frag, defines: defs,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  pts.frustumCulled = false;
  parent.add(pts);
  return pts;
};

// ---------- 1. Trái tim: điểm trên đường viền tim 2D thu nhỏ theo góc phi => thân tim phồng 3D (đã giảm sáng)
const c1 = new THREE.Color(0xff1744), c2 = new THREE.Color(0xff4fd8);
const heartPoint = (out, i) => {
  const t = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const inner = Math.random() < 0.25 ? Math.sqrt(Math.random()) : 1;
  const k = Math.sin(phi) * (0.97 + Math.random() * 0.06) * inner;
  const hx = 16 * Math.sin(t) ** 3;
  const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  const j = () => (Math.random() - 0.5) * 0.5;
  out.set([hx * k + j(), hy * k + 2 + j(), 9 * Math.cos(phi) * inner + j()], i * 3);
  return hy * k;
};
const heart = makePoints(16000, (i, pos, c) => {
  const y = heartPoint(pos, i);
  c.lerpColors(c1, c2, Math.min(1, Math.max(0, (y + 17) / 30 + (Math.random() - 0.5) * 0.3)));
  c.multiplyScalar(0.8);
}, { size: 0.42, bright: 0.45 });

// ---------- 2. Tia sáng bay lên từ tim
const sparks = makePoints(500, (i, pos, c) => {
  heartPoint(pos, i);
  pos[i * 3] *= 1.15; pos[i * 3 + 2] *= 1.15;
  c.setHSL(0.92 + Math.random() * 0.08, 1, 0.65);
}, { size: 0.7, bright: 0.8, defs: { SPARKS: '' } });

// ---------- 3. Những trái tim nhỏ bồng bềnh bay lên xung quanh
makePoints(45, (i, pos, c) => {
  pos.set([(Math.random() - 0.5) * 50, -28 + Math.random() * 6, (Math.random() - 0.5) * 30], i * 3);
  c.setHSL(0.92 + Math.random() * 0.08, 0.9, 0.62);
}, { size: 3.2, bright: 0.9, defs: { SPARKS: '', HEARTS: '' }, rise: 55 });

// ---------- 4. Hai vòng quỹ đạo lấp lánh quay ngược chiều nhau, nghiêng khác nhau
const orbits = [
  { tilt: [1.2, 0, 0.3], speed: 0.35, hue: 0.12 },   // vàng kim
  { tilt: [-0.9, 0, -0.5], speed: -0.25, hue: 0.75 } // tím
].map(({ tilt, speed, hue }) => {
  const group = new THREE.Group();
  group.rotation.set(...tilt);
  group.position.y = 2;
  scene.add(group);
  const pts = makePoints(1200, (i, pos, c) => {
    const r = 25 + Math.random() * 3.5, a = Math.random() * 6.283;
    pos.set([r * Math.cos(a), (Math.random() - 0.5) * 1.2, r * Math.sin(a)], i * 3);
    c.setHSL(hue + Math.random() * 0.06, 0.8, 0.65);
  }, { size: 0.5, bright: 0.8, parent: group });
  return { pts, speed };
});

// ---------- 5. Bụi sao nền
const stars = makePoints(1500, (i, pos, c) => {
  const r = 40 + Math.random() * 90, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
  pos.set([r * Math.sin(b) * Math.cos(a), r * Math.sin(b) * Math.sin(a), r * Math.cos(b)], i * 3);
  c.setHSL(0.88 + Math.random() * 0.15, 0.7, 0.55 + Math.random() * 0.3);
}, { size: 0.8, bright: 0.8 });

// ---------- 6. Sóng xung kích lan ra theo mỗi nhịp đập
const rings = [0, 1].map(() => {
  const m = new THREE.Mesh(
    new THREE.RingGeometry(1, 1.03, 128),
    new THREE.MeshBasicMaterial({ color: 0xff5fa8, transparent: true, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  m.rotation.x = 1.15;
  m.position.y = 2;
  scene.add(m);
  return m;
});

// ---------- 7. Quầng sáng mờ phía sau tim
const aura = (() => {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,60,140,0.9)');
  grd.addColorStop(0.5, 'rgba(160,20,90,0.35)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.25
  }));
  s.position.set(0, 2, -8);
  scene.add(s);
  return s;
})();

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  uniforms.uScale.value = h * PR / 2;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  camera.userData.z = w / h < 1 ? 55 / (w / h) * 0.9 : 55; // màn hình dọc: lùi camera
}
addEventListener('resize', resize);
resize();

// Nhịp "thình-thịch": hai xung Gauss mỗi chu kỳ
const PERIOD = 1.2;
const bump = (p, c) => Math.exp(-(((p - c) * 14) ** 2));
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime(), p = (t % PERIOD) / PERIOD;
  const beat = bump(p, 0.1) + 0.7 * bump(p, 0.3);
  uniforms.uTime.value = t;
  uniforms.uBeat.value = beat;

  heart.scale.setScalar(1 + 0.14 * beat);
  heart.rotation.y = sparks.rotation.y = t * 0.35;
  stars.rotation.set(t * 0.01, t * 0.02, 0);
  orbits.forEach(o => { o.pts.rotation.y = t * o.speed; });

  rings.forEach((m, k) => {
    const u = ((((t / PERIOD - 0.1) / 2 + k * 0.5) % 1) + 1) % 1;   // 0 = vừa đập, 1 = tan biến
    m.scale.setScalar(14 + u * 50);
    m.material.opacity = (1 - u) ** 2 * 0.4;
  });
  aura.scale.setScalar(55 + 12 * beat);
  aura.material.opacity = 0.2 + 0.1 * beat;

  bloom.strength = 0.4 + 0.25 * beat;
  camera.position.set(Math.sin(t * 0.25) * 5, Math.sin(t * 0.17) * 2, camera.userData.z);
  camera.lookAt(0, 0, 0);
  composer.render();
});
</script>
</body>
</html>
